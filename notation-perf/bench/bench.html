<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>记谱渲染性能基准</title>
<style>
  body{font:13px/1.6 system-ui,"Segoe UI",sans-serif;margin:16px}
  h1{font-size:16px}
  table{border-collapse:collapse;margin-top:10px;font-variant-numeric:tabular-nums}
  th,td{border:1px solid #ccc;padding:3px 8px;text-align:right}
  th:first-child,td:first-child{text-align:left}
  #stage{position:absolute;left:-10000px;top:0;overflow:hidden}
  #raw{white-space:pre-wrap;font:11px/1.4 ui-monospace,Consolas,monospace;margin-top:12px;color:#444}
</style>
<body>
<h1>简谱 / 五线谱记号渲染性能基准</h1>
<p id="meta"></p>
<div id="stage"></div>
<div id="report"></div>
<pre id="raw"></pre>

<script src="../src/geometry.js"></script>
<script src="../src/render-svg.js"></script>
<script src="../src/render-canvas.js"></script>
<script src="../src/render-img-sprite.js"></script>
<script src="../src/render-unicode-text.js"></script>
<script src="../src/render-jianpu.js"></script>
<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var N_NOTES = parseInt(q.get('n') || '2000', 10);
  var NOTATION = q.get('vocab') || 'mixed';   // mixed | dur | rest
  var SIZE = parseFloat(q.get('size') || '6');   // 每个 staff space 的像素（谱面密度）
  var PER_ROW = parseInt(q.get('perRow') || '50', 10);
  var DUR = ['whole', 'half', 'quarter', 'eighth', 'sixteenth'];
  var REST = ['restWhole', 'restHalf', 'restQuarter', 'restEighth', 'restSixteenth'];
  var GLYPHS = NOTATION === 'rest' ? REST : (NOTATION === 'dur' ? DUR : DUR.concat(REST));

  var stage = document.getElementById('stage');
  var errs = [];
  window.onerror = function (m) { errs.push(String(m)); };

  var order = ['svg', 'canvasVector', 'canvasSprite', 'imgPerGlyph', 'cssAtlas',
               'textSMP', 'textBMP', 'jianpuHTML', 'jianpuSVG'];

  var out = { n: N_NOTES, dpr: window.devicePixelRatio, vocab: GLYPHS, results: {}, errors: errs };

  // 统一布局（所有画法共用同一坐标，保证公平）
  var layout = Notation.gridLayout(GLYPHS, N_NOTES,
    { size: SIZE, pitch: 5.2, rowH: 7.5, perRow: PER_ROW });
  out.layout = { width: layout.width, height: layout.height, size: layout.size,
                 perRow: layout.perRow, rows: layout.rows };
  // Canvas 的成本跟"画布总像素"成正比，DOM 的成本跟"节点数"成正比 —— 两个数都要记录
  out.canvasMP = +(layout.width * layout.height * out.dpr * out.dpr / 1e6).toFixed(1);

  // 一次性资源：预光栅化图集（画法 C/D/E 共用），单独计时
  var t0 = performance.now();
  var atlas = Renderers._buildAtlas(layout.size, window.devicePixelRatio || 1);
  out.atlasMs = +(performance.now() - t0).toFixed(1);

  out.unicodeCoverage = Renderers._unicodeCoverage();

  function measure(id, fn) {
    var host = document.createElement('div');
    host.style.cssText = 'position:relative;width:' + layout.width + 'px';
    stage.appendChild(host);
    var r = { build: 0, layout: 0, raster: 0, heapMB: 0, nodes: 0 };
    var t;
    try {
      t = performance.now();
      var root = fn(host);
      r.build = +(performance.now() - t).toFixed(1);

      t = performance.now();
      void host.getBoundingClientRect();
      if (root) void root.getBoundingClientRect();
      r.layout = +(performance.now() - t).toFixed(1);

      var renderer = Renderers[id];
      if (renderer && renderer.flush) {
        t = performance.now();
        renderer.flush(root);
        r.raster = +(performance.now() - t).toFixed(1);
      }
      r.nodes = host.querySelectorAll('*').length;
      if (performance.memory) r.heapMB = +(performance.memory.usedJSHeapSize / 1048576).toFixed(1);
    } catch (e) {
      r.error = String(e && e.message || e);
      errs.push(id + ': ' + r.error);
    }
    stage.removeChild(host);
    out.results[id] = r;
    return r;
  }

  function run(id) {
    var R = Renderers[id];
    if (!R) { errs.push('missing renderer ' + id); return; }
    // 预热（第一次可能触发字体加载/路径缓存/解码，不计入）
    try { var h = document.createElement('div'); stage.appendChild(h); R.render(h, layout, atlas); stage.removeChild(h); }
    catch (e) { errs.push('warmup ' + id + ': ' + e); }
    var r = measure(id, function (host) {
      if (id === 'canvasSprite' || id === 'imgPerGlyph' || id === 'cssAtlas') return R.render(host, layout, atlas);
      return R.render(host, layout);
    });
    r.label = R.label;
  }

  order.forEach(run);

  // 第二轮：同上但复用热缓存，用来观察“重建整谱”的稳定值
  order.forEach(function (id) {
    var hot = out.results[id];
    if (hot && !hot.error) hot.buildHot = measure(id + '__hot', function (host) { return Renderers[id].render(host, layout, atlas); }).build;
  });
  order.forEach(function (id) { delete out.results[id + '__hot']; });

  // 第三轮：连续重绘吞吐（模拟拖动/缩放时每秒能整谱重绘几次）
  order.forEach(function (id) {
    var r = out.results[id];
    if (!r || r.error) return;
    var host = document.createElement('div');
    host.style.cssText = 'position:relative;width:' + layout.width + 'px';
    stage.appendChild(host);
    var R = Renderers[id], count = 0, t0 = performance.now(), deadline = t0 + 400;
    while (performance.now() < deadline) {
      host.innerHTML = '';
      var root = R.render(host, layout, atlas);
      void host.getBoundingClientRect();          // 强制样式/布局
      if (R.flush) R.flush(root);                 // Canvas：把光栅化也算进去
      count++;
    }
    var dt = performance.now() - t0;
    r.rps = +(count / (dt / 1000)).toFixed(1);
    r.frameMs = +(dt / count).toFixed(2);
    stage.removeChild(host);
  });

  var json = JSON.stringify(out);
  document.body.setAttribute('data-bench', json);
  document.getElementById('raw').textContent = JSON.stringify(out, null, 1);
  renderTable();

  function renderTable() {
    var rows = order.map(function (id) {
      var r = out.results[id] || {};
      var avg = r.build && r.buildHot ? ((r.build + r.buildHot) / 2).toFixed(1) : (r.build || '');
      return '<tr><td>' + (r.label || id) + '</td><td>' + (r.build || '') + '</td><td>' + (r.buildHot || '') +
             '</td><td>' + avg + '</td><td>' + (r.layout || '') + '</td><td>' + (r.raster || '') + '</td><td>' +
             (r.nodes || '') + '</td><td>' + (r.heapMB || '') + '</td><td>' + (r.frameMs || '') + '</td><td>' + (r.rps || '') + '</td></tr>';
    }).join('');
    document.getElementById('report').innerHTML =
      '<table><tr><th>画法</th><th>首次构建 ms</th><th>热缓存构建 ms</th><th>平均构建 ms</th>' +
      '<th>强制布局 ms</th><th>光栅化 ms</th><th>DOM 节点</th><th>JS 堆 MB</th>' +
      '<th>整谱重绘 ms</th><th>重绘/秒</th></tr>' + rows + '</table>';
    document.getElementById('meta').textContent =
      '音符数 N=' + out.n + '　devicePixelRatio=' + out.dpr + '　布局 ' + layout.width + '×' + layout.height +
      'px　图集预光栅化 ' + out.atlasMs + 'ms';
  }
})();
</script>
</body>
</html>
